# دستیار هوشمند کسب‌وکارهای مجازی — single-server development baseline.
# PostgreSQL 17 is the conservative fallback per TECHNOLOGY_AND_REPO_SPECIFICATION_V1
# (production target: PostgreSQL 18, to be verified before launch — Gate I).
name: ai-assistant-admin

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_assistant
      # NOTE: POSTGRES_PASSWORD is only used on first volume init.
      # If you changed password in DB or have auth issues after rebuild:
      # docker compose exec postgres psql -U postgres -d ai_assistant -c "ALTER USER postgres WITH PASSWORD 'postgres';"
      # Or if volume has old password: docker volume rm ai-assistant-admin_pgdata && up + alembic upgrade head
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_assistant"]
      interval: 5s
      timeout: 3s
      retries: 12
    # Reduce memory pressure on weak VPS (1GB RAM) — prevents OOM kills
    # that caused "database system is in recovery mode"
    command: >
      postgres -c shared_buffers=64MB
               -c effective_cache_size=256MB
               -c work_mem=4MB
               -c maintenance_work_mem=64MB
               -c max_connections=50

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru

  web:
    build: .
    restart: unless-stopped
    environment:
      ENVIRONMENT: dev
      SECRET_KEY: dev-only-change-me
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/ai_assistant
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      LOG_LEVEL: INFO
      DB_POOL_SIZE: 3
      DB_MAX_OVERFLOW: 5
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: uvicorn app.interfaces.http.app:app --host 0.0.0.0 --port 8000

  worker:
    build: .
    restart: unless-stopped
    environment:
      ENVIRONMENT: dev
      SECRET_KEY: dev-only-change-me
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/ai_assistant
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      LOG_LEVEL: INFO
      DB_POOL_SIZE: 2
      DB_MAX_OVERFLOW: 3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.workers.celery_app:celery worker --loglevel=INFO --concurrency=1

volumes:
  pgdata:
